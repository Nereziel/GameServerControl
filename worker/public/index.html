<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>GameServerControl</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#15181d;--panel2:#1d2128;--border:#303640;--text:#eef0f3;--dim:#9aa3ad;--accent:#e0294a;--ok:#42b95c;--warn:#d5a329;--bad:#747d89}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;padding:15px 20px;background:rgba(21,24,29,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}h1{font-size:18px;margin:0}.sub{color:var(--dim);font-size:12px}.status{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--dim)}.dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}.status.up .dot{background:var(--ok)}button{border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);padding:7px 11px;font-weight:600;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);border-color:var(--accent)}main{max-width:1180px;margin:0 auto;padding:18px}.notice{padding:12px 14px;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--dim);margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:15px}.top{display:flex;align-items:flex-start;gap:12px}.grow{flex:1;min-width:0}.name{font-size:17px;font-weight:700;overflow-wrap:anywhere}.meta{margin-top:6px;color:var(--dim);font-size:12px;overflow-wrap:anywhere}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.badge{border:1px solid var(--border);border-radius:12px;padding:2px 8px;font-size:11px}.badge.ok{border-color:var(--ok);color:var(--ok)}.badge.warn{border-color:var(--warn);color:var(--warn)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.empty{text-align:center;color:var(--dim);padding:70px 20px}.toast{position:fixed;right:16px;bottom:16px;max-width:430px;padding:11px 14px;border:1px solid var(--border);background:var(--panel);border-radius:7px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}.toast.err{border-color:var(--accent)}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}@media(max-width:600px){header{padding:12px;flex-wrap:wrap}.sub{display:none}.status{margin-left:0}main{padding:12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <h1>GameServerControl</h1>
    <div class="sub">Cloudflare Worker dashboard · Windows node</div>
  </div>
  <div id="connection" class="status"><span class="dot"></span><span id="connectionText">Connecting…</span></div>
  <button id="refreshBtn">Refresh</button>
</header>
<main>
  <div class="notice">This panel does not store a GameServerControl API token in the browser. Authentication to the agent is performed by the Worker.</div>
  <div id="cards" class="grid"><div class="empty">Loading servers…</div></div>
</main>
<div id="toast" class="toast"></div>
<script>
const NODE = 'windows';
const $ = (s) => document.querySelector(s);
let servers = [];
let statuses = new Map();
let refreshTimer = null;

async function api(path, options = {}) {
  const headers = new Headers(options.headers || {});
  if (options.body && !headers.has('content-type')) headers.set('content-type', 'application/json');
  const response = await fetch(`/api/${NODE}${path}`, { ...options, headers, credentials: 'same-origin' });
  const text = await response.text();
  let body = null;
  if (text) {
    try { body = JSON.parse(text); } catch { body = text; }
  }
  if (!response.ok) {
    const message = typeof body === 'object' && body && body.error ? body.error : (text || `HTTP ${response.status}`);
    throw new Error(message);
  }
  return body;
}

function toast(message, error = false) {
  const el = $('#toast');
  el.textContent = message;
  el.className = 'toast show' + (error ? ' err' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.className = 'toast', 3000);
}

function setConnection(ok) {
  $('#connection').classList.toggle('up', ok);
  $('#connectionText').textContent = ok ? 'Connected' : 'Gateway unavailable';
}

function statusFor(id) { return statuses.get(id) || {}; }

function badge(text, cls = '') {
  const el = document.createElement('span');
  el.className = 'badge ' + cls;
  el.textContent = text;
  return el;
}

function actionButton(label, action, id, primary = false) {
  const button = document.createElement('button');
  button.textContent = label;
  if (primary) button.classList.add('primary');
  button.addEventListener('click', () => runAction(button, id, action));
  return button;
}

function render() {
  const root = $('#cards');
  root.replaceChildren();
  if (!servers.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No servers configured on the Windows agent.';
    root.appendChild(empty);
    return;
  }

  for (const server of servers) {
    const status = statusFor(server.id);
    const running = status.processState === 'Running';
    const card = document.createElement('section');
    card.className = 'card';

    const top = document.createElement('div'); top.className = 'top';
    const grow = document.createElement('div'); grow.className = 'grow';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = server.name || server.id;
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = `${server.gameType || 'Custom'} · ${server.guestWorkingDir || ''}`;
    const badges = document.createElement('div'); badges.className = 'badges';
    badges.appendChild(badge(running ? `RUNNING${status.pidInGuest ? ` · PID ${status.pidInGuest}` : ''}` : (status.processState || 'UNKNOWN'), running ? 'ok' : ''));
    if (status.cpuPercent != null) badges.appendChild(badge(`${Number(status.cpuPercent).toFixed(1)}% CPU`));
    if (status.memoryMB != null) badges.appendChild(badge(`${Number(status.memoryMB).toLocaleString()} MB`));
    if (server.steamAppId) badges.appendChild(badge(`Steam ${server.steamAppId}`));
    grow.append(name, meta, badges); top.appendChild(grow); card.appendChild(top);

    const actions = document.createElement('div'); actions.className = 'actions';
    actions.append(
      actionButton('Start', 'start', server.id, !running),
      actionButton('Stop', 'stop', server.id),
      actionButton('Restart', 'restart', server.id),
      actionButton('Backup', 'backup', server.id),
      actionButton('Update', 'update', server.id)
    );
    card.appendChild(actions);
    root.appendChild(card);
  }
}

async function load() {
  $('#refreshBtn').disabled = true;
  try {
    const [serverList, statusList] = await Promise.all([
      api('/servers'),
      api('/status')
    ]);
    servers = Array.isArray(serverList) ? serverList : [];
    statuses = new Map((Array.isArray(statusList) ? statusList : []).map(s => [s.id, s]));
    setConnection(true);
    render();
  } catch (error) {
    setConnection(false);
    toast(error.message || String(error), true);
  } finally {
    $('#refreshBtn').disabled = false;
  }
}

async function runAction(button, id, action) {
  button.disabled = true;
  try {
    const result = await api(`/servers/${encodeURIComponent(id)}/${action}`, { method: 'POST' });
    toast(result && result.message ? result.message : `${action} completed`);
    await load();
  } catch (error) {
    toast(error.message || String(error), true);
  } finally {
    button.disabled = false;
  }
}

$('#refreshBtn').addEventListener('click', load);
load();
refreshTimer = setInterval(load, 5000);
</script>
</body>
</html>
