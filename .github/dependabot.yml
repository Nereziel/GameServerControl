version: 2

updates:
  # Keep the .NET 8 Agent/API/Web application on its current major line.
  - package-ecosystem: "nuget"
    directories:
      - "/src/GameServerControl.Agent"
      - "/src/GameServerControl.Shared"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5

  # Cloudflare Worker tooling. Wrangler stays pinned to a tested major.
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    groups:
      worker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
