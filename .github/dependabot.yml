version: 2

updates:
  # Keep the .NET 8 application on its current major line. Major framework/package
  # upgrades are deliberate migrations, not routine dependency maintenance.
  - package-ecosystem: "nuget"
    directories:
      - "/src/GameServerControl.Agent"
      - "/src/GameServerControl.Client"
      - "/src/GameServerControl.Shared"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5

  # Cloudflare Worker tooling. Wrangler stays pinned to a tested major; routine
  # minor/patch updates are grouped into one PR and must still pass Worker CI.
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    groups:
      worker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 3

  # GitHub Actions are validated by CI before merge.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
