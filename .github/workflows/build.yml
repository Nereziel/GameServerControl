name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows-build:
    name: Windows (agent + WPF client)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate PowerShell installers
        shell: pwsh
        run: |
          $errors = @()
          foreach ($file in @('deploy/windows/install.ps1', 'deploy/windows/install-client.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $errors += $parseErrors | ForEach-Object { "$file : $($_.Message)" }
            }
          }
          if ($errors.Count -gt 0) { throw ($errors -join "`n") }

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      # Publish deployable bundles with the .NET runtime included. This avoids host
      # runtime patch mismatches on clean Windows Server installations.
      - name: Publish agent (win-x64, self-contained)
        run: dotnet publish src/GameServerControl.Agent -c Release -r win-x64 --self-contained true -o publish/Agent-windows

      - name: Publish client (win-x64, self-contained)
        run: dotnet publish src/GameServerControl.Client -c Release -r win-x64 --self-contained true -o publish/Client-windows

      - name: Upload Windows agent
        uses: actions/upload-artifact@v7
        with:
          name: GameServerControl-Agent-windows
          path: publish/Agent-windows
          if-no-files-found: error

      - name: Upload Windows client
        uses: actions/upload-artifact@v7
        with:
          name: GameServerController-windows
          path: publish/Client-windows
          if-no-files-found: error

  linux-build:
    name: Linux (agent only — WPF doesn't run on Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate Linux installers
        run: |
          bash -n deploy/linux/install-from-release.sh
          bash -n deploy/linux/install.sh

      - name: Validate Web UI JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('src/GameServerControl.Agent/WebUi/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No inline Web UI script found')
          Path('/tmp/gsc-webui.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/gsc-webui.js

      # We only build Shared + Agent on Linux — the WPF client targets net8.0-windows.
      - name: Restore Shared
        run: dotnet restore src/GameServerControl.Shared

      - name: Restore Agent
        run: dotnet restore src/GameServerControl.Agent

      - name: Build Agent (Release)
        run: dotnet build src/GameServerControl.Agent -c Release --no-restore

      - name: Publish agent (linux-x64, self-contained)
        run: dotnet publish src/GameServerControl.Agent -c Release -r linux-x64 --self-contained true -o publish/Agent-linux

      - name: Stage deploy artifacts alongside agent
        run: |
          cp deploy/linux/gameservercontrol-agent.service publish/Agent-linux/
          cp deploy/linux/install.sh publish/Agent-linux/
          chmod +x publish/Agent-linux/install.sh
          chmod +x publish/Agent-linux/GameServerControl.Agent

      - name: Upload Linux agent
        uses: actions/upload-artifact@v7
        with:
          name: GameServerControl-Agent-linux
          path: publish/Agent-linux
          if-no-files-found: error
