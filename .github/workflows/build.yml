name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows-build:
    name: Windows agent + web UI + tray
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('deploy/windows/install.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw (($parseErrors | ForEach-Object { $_.Message }) -join "`n") }

      - name: Validate Web UI JavaScript
        run: node scripts/validate-webui.mjs

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Publish agent (win-x64, self-contained)
        run: dotnet publish src/GameServerControl.Agent -c Release -r win-x64 --self-contained true -o publish/Agent-windows

      - name: Publish tray helper (win-x64, self-contained)
        run: dotnet publish src/GameServerControl.Tray -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/Tray-windows

      - name: Upload Windows agent
        uses: actions/upload-artifact@v7
        with:
          name: GameServerControl-Agent-windows
          path: publish/Agent-windows
          if-no-files-found: error

      - name: Upload Windows tray helper
        uses: actions/upload-artifact@v7
        with:
          name: GameServerControl-Tray-windows
          path: publish/Tray-windows
          if-no-files-found: error

  linux-build:
    name: Linux agent + web UI + relay
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate Linux installers
        run: |
          bash -n deploy/linux/install-from-release.sh
          bash -n deploy/linux/install.sh
          bash -n deploy/relay/install-from-release.sh
          bash -n deploy/relay/install.sh

      - name: Validate Web UI JavaScript
        run: node scripts/validate-webui.mjs

      - name: Restore Shared
        run: dotnet restore src/GameServerControl.Shared

      - name: Validate Valheim + Dragonwilds profile contracts
        run: dotnet run --project tools/GameServerControl.ProfileCheck -c Release

      - name: Restore Agent
        run: dotnet restore src/GameServerControl.Agent

      - name: Build Agent (Release)
        run: dotnet build src/GameServerControl.Agent -c Release --no-restore

      - name: Restore Relay
        run: dotnet restore src/GameServerControl.Relay

      - name: Build Relay (Release)
        run: dotnet build src/GameServerControl.Relay -c Release --no-restore

      - name: Publish agent (linux-x64, self-contained)
        run: dotnet publish src/GameServerControl.Agent -c Release -r linux-x64 --self-contained true -o publish/Agent-linux

      - name: Publish relay (linux-x64, self-contained)
        run: dotnet publish src/GameServerControl.Relay -c Release -r linux-x64 --self-contained true -o publish/Relay-linux

      - name: Stage deploy artifacts
        run: |
          cp deploy/linux/gameservercontrol-agent.service publish/Agent-linux/
          cp deploy/linux/install.sh publish/Agent-linux/
          chmod +x publish/Agent-linux/install.sh
          chmod +x publish/Agent-linux/GameServerControl.Agent
          cp deploy/relay/gameservercontrol-relay.service publish/Relay-linux/
          cp deploy/relay/install.sh publish/Relay-linux/
          cp deploy/relay/install-from-release.sh publish/Relay-linux/
          chmod +x publish/Relay-linux/install.sh publish/Relay-linux/install-from-release.sh
          chmod +x publish/Relay-linux/GameServerControl.Relay

      - name: Upload Linux agent
        uses: actions/upload-artifact@v7
        with:
          name: GameServerControl-Agent-linux
          path: publish/Agent-linux
          if-no-files-found: error

      - name: Upload Linux relay
        uses: actions/upload-artifact@v7
        with:
          name: GameServerControl-Relay-linux
          path: publish/Relay-linux
          if-no-files-found: error
