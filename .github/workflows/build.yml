name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows agent + runner + web UI + tray
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate PowerShell installers
        shell: pwsh
        run: |
          foreach ($script in @('deploy/windows/install.ps1', 'deploy/cloudflare/install-tunnel-windows.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "$script`n$((($parseErrors | ForEach-Object { $_.Message }) -join "`n"))" }
          }
          & ./scripts/validate-windows-updater.ps1

      - name: Validate Web UI JavaScript
        run: node scripts/validate-webui.mjs

      - name: Validate ReadOnly Web UI
        run: node scripts/validate-readonly-ui.mjs

      - name: Validate global Settings ownership
        run: node scripts/validate-global-settings.mjs

      - name: Validate mod/plugin management
        run: node scripts/validate-mod-management.mjs

      - name: Validate audit SEC-03 through SEC-06
        run: node scripts/validate-audit-sec03-sec06.mjs

      - name: Validate backup safety
        run: dotnet run --project tools/GameServerControl.BackupCheck -c Release

      - name: Validate token storage security
        run: dotnet run --project tools/GameServerControl.SecurityCheck -c Release

      - name: Validate SEC-08 encrypted secret storage
        run: dotnet run --project tools/GameServerControl.SecretProtectionCheck -c Release

      - name: Validate Agent security access
        run: node scripts/validate-security-access.mjs

      - name: Validate audit fixes 1-3
        run: node scripts/validate-audit-1-3.mjs

      - name: Validate audit fixes 4-6
        run: node scripts/validate-audit-4-6.mjs

      - name: Validate backup lifecycle
        run: node scripts/validate-backup-lifecycle.mjs

      - name: Validate backup workspace UI
        run: node scripts/validate-backup-ui.mjs

      - name: Restore
        run: dotnet restore

      - name: Validate Agent platform analyzer
        run: dotnet build src/GameServerControl.Agent -c Release --no-restore -warnaserror:CA1416

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Publish agent (win-x64, self-contained)
        run: dotnet publish src/GameServerControl.Agent -c Release -r win-x64 --self-contained true -o publish/Agent-windows

      - name: Publish runner (win-x64, self-contained)
        run: dotnet publish src/GameServerControl.Runner -c Release -r win-x64 --self-contained true -o publish/Runner-windows

      - name: Publish tray helper (win-x64, self-contained)
        run: dotnet publish src/GameServerControl.Tray -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/Tray-windows

      - name: Upload Windows agent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: GameServerControl-Agent-windows
          path: publish/Agent-windows
          if-no-files-found: error

      - name: Upload Windows runner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: GameServerControl-Runner-windows
          path: publish/Runner-windows
          if-no-files-found: error

      - name: Upload Windows tray helper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: GameServerControl-Tray-windows
          path: publish/Tray-windows
          if-no-files-found: error

  linux-build:
    name: Linux agent + web UI + relay
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate Linux installers
        run: |
          bash -n deploy/linux/install-from-release.sh
          bash -n deploy/linux/install.sh
          bash -n deploy/relay/install-from-release.sh
          bash -n deploy/relay/install.sh
          bash -n deploy/relay/ufw-reconcile.sh
          bash -n scripts/test-relay-ufw-reconcile.sh

      - name: Test Relay UFW reconciliation
        run: bash scripts/test-relay-ufw-reconcile.sh

      - name: Validate Web UI JavaScript
        run: node scripts/validate-webui.mjs

      - name: Validate release workflow gate
        run: node scripts/validate-release-workflow.mjs

      - name: Validate ReadOnly Web UI
        run: node scripts/validate-readonly-ui.mjs

      - name: Validate global Settings ownership
        run: node scripts/validate-global-settings.mjs

      - name: Validate mod/plugin management
        run: node scripts/validate-mod-management.mjs

      - name: Validate audit SEC-03 through SEC-06
        run: node scripts/validate-audit-sec03-sec06.mjs

      - name: Validate backup safety
        run: dotnet run --project tools/GameServerControl.BackupCheck -c Release

      - name: Validate token storage security
        run: dotnet run --project tools/GameServerControl.SecurityCheck -c Release

      - name: Validate SEC-08 encrypted secret storage
        run: dotnet run --project tools/GameServerControl.SecretProtectionCheck -c Release

      - name: Validate Agent security access
        run: node scripts/validate-security-access.mjs

      - name: Validate audit fixes 1-3
        run: node scripts/validate-audit-1-3.mjs

      - name: Validate audit fixes 4-6
        run: node scripts/validate-audit-4-6.mjs

      - name: Validate backup lifecycle
        run: node scripts/validate-backup-lifecycle.mjs

      - name: Validate backup workspace UI
        run: node scripts/validate-backup-ui.mjs

      - name: Validate Cloudflare Worker bundle
        working-directory: src/GameServerControl.Cloud
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          cat > /tmp/gsc-cloud-ci-secrets.json <<'JSON'
          {
            "AGENT_ORIGIN": "https://origin.invalid",
            "AGENT_ADMIN_TOKEN": "ci-admin-agent-token",
            "AGENT_READONLY_TOKEN": "ci-readonly-agent-token",
            "ACCESS_ADMIN_EMAILS": "admin@example.invalid",
            "ORIGIN_ACCESS_CLIENT_ID": "ci-client-id",
            "ORIGIN_ACCESS_CLIENT_SECRET": "ci-client-secret",
            "ACCESS_TEAM_DOMAIN": "https://ci.cloudflareaccess.com",
            "ACCESS_POLICY_AUD": "ci-audience"
          }
          JSON
          npx wrangler deploy --dry-run --secrets-file /tmp/gsc-cloud-ci-secrets.json --outdir ../../publish/Cloud-worker
          rm -f /tmp/gsc-cloud-ci-secrets.json

      - name: Restore Shared
        run: dotnet restore src/GameServerControl.Shared

      - name: Validate Valheim + Dragonwilds profile contracts
        run: dotnet run --project tools/GameServerControl.ProfileCheck -c Release

      - name: Restore Agent
        run: dotnet restore src/GameServerControl.Agent

      - name: Build Agent (Release)
        run: dotnet build src/GameServerControl.Agent -c Release --no-restore -warnaserror:CA1416

      - name: Restore Relay
        run: dotnet restore src/GameServerControl.Relay

      - name: Build Relay (Release)
        run: dotnet build src/GameServerControl.Relay -c Release --no-restore

      - name: Publish agent (linux-x64, self-contained)
        run: dotnet publish src/GameServerControl.Agent -c Release -r linux-x64 --self-contained true -o publish/Agent-linux

      - name: Publish relay (linux-x64, self-contained)
        run: dotnet publish src/GameServerControl.Relay -c Release -r linux-x64 --self-contained true -o publish/Relay-linux

      - name: Stage deploy artifacts
        run: |
          cp deploy/linux/gameservercontrol-agent.service publish/Agent-linux/
          cp deploy/linux/install.sh publish/Agent-linux/
          chmod +x publish/Agent-linux/install.sh
          chmod +x publish/Agent-linux/GameServerControl.Agent
          cp deploy/relay/gameservercontrol-relay.service publish/Relay-linux/
          cp deploy/relay/install.sh publish/Relay-linux/
          cp deploy/relay/install-from-release.sh publish/Relay-linux/
          cp deploy/relay/ufw-reconcile.sh publish/Relay-linux/
          chmod +x publish/Relay-linux/install.sh publish/Relay-linux/install-from-release.sh
          chmod +x publish/Relay-linux/GameServerControl.Relay

      - name: Upload Linux agent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: GameServerControl-Agent-linux
          path: publish/Agent-linux
          if-no-files-found: error

      - name: Upload Linux relay
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: GameServerControl-Relay-linux
          path: publish/Relay-linux
          if-no-files-found: error
