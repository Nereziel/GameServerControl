name: Apply BUG-02 implementation (temporary)

on:
  push:
    branches: [fix/audit-bug02-update-health]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Apply deterministic transform
        run: python3 scripts/apply-bug02-transform.py
      - name: Validate transformed files
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-update-health.mjs
          bash -n deploy/linux/install-from-release.sh
          dotnet run --project tools/GameServerControl.SecurityCheck -c Release
          pwsh -NoProfile -Command '& { $t=$null; $e=$null; [System.Management.Automation.Language.Parser]::ParseFile("deploy/windows/install.ps1", [ref]$t, [ref]$e) | Out-Null; if ($e.Count) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }; ./scripts/validate-windows-updater.ps1 }'
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-bug02-transform.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/windows/install.ps1 deploy/linux/install-from-release.sh tools/GameServerControl.SecurityCheck/Program.cs scripts/apply-bug02-transform.py
          git commit -m 'fix: require authenticated stable update health'
          git push origin HEAD:fix/audit-bug02-update-health
