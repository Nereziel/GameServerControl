name: Apply exact release version fix

on:
  push:
    branches:
      - fix/release-exact-product-version
    paths:
      - '.github/workflows/apply-release-version-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/release-exact-product-version

      - name: Apply and verify exact ProductVersion fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/workflows/release.yml')
          text = path.read_text()
          pattern = r'(?m)^(          -p:InformationalVersion=.*)$'
          matches = re.findall(pattern, text)
          if len(matches) != 5:
              raise SystemExit(f'expected 5 release publish commands, found {len(matches)}')
          replacement = r'\1\n          -p:IncludeSourceRevisionInInformationalVersion=false'
          path.write_text(re.sub(pattern, replacement, text))
          PY
          node scripts/validate-release-workflow.mjs

      - name: Commit fix and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-release-version-fix.yml
          git add .github/workflows/release.yml
          git commit -m 'fix: emit exact release ProductVersion'
          git push origin HEAD:fix/release-exact-product-version
