name: Deploy Cloudflare panel

on:
  workflow_dispatch:
    inputs:
      panel_hostname:
        description: 'Cloudflare Access-protected Worker hostname'
        required: true
        default: panel.overcore.eu
        type: string
      gateway_origin:
        description: 'Public HTTPS hostname of the VPS Caddy forwarding gateway'
        required: true
        default: https://server.overcore.eu
        type: string
      access_team_domain:
        description: 'https://example.cloudflareaccess.com'
        required: true
        type: string
      access_policy_aud:
        description: 'AUD tag for the Access application protecting the Worker'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy independent Multi-Agent Cloudflare WebUI
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        working-directory: src/GameServerControl.Cloud
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and test shared WebUI
        working-directory: src/GameServerControl.Cloud
        run: |
          npm run build
          npm test

      - name: Validate deployment configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOSTS_ENCRYPTION_KEY: ${{ secrets.GSC_CF_HOSTS_ENCRYPTION_KEY }}
          GATEWAY_SHARED_KEY: ${{ secrets.GSC_CF_GATEWAY_SHARED_KEY }}
          ACCESS_ADMIN_EMAILS: ${{ secrets.GSC_CF_ACCESS_ADMIN_EMAILS }}
          PANEL_HOSTNAME: ${{ inputs.panel_hostname }}
          GATEWAY_ORIGIN: ${{ inputs.gateway_origin }}
          ACCESS_TEAM_DOMAIN: ${{ inputs.access_team_domain }}
          ACCESS_POLICY_AUD: ${{ inputs.access_policy_aud }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN HOSTS_ENCRYPTION_KEY \
              GATEWAY_SHARED_KEY ACCESS_ADMIN_EMAILS PANEL_HOSTNAME GATEWAY_ORIGIN \
              ACCESS_TEAM_DOMAIN ACCESS_POLICY_AUD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required value $name is missing."
              exit 1
            fi
          done
          node <<'NODE'
          const fail = message => { console.error('::error::' + message); process.exit(1); };
          const panel = process.env.PANEL_HOSTNAME || '';
          if (!/^[a-z0-9.-]+$/.test(panel) || !panel.includes('.'))
            fail('panel_hostname must be a lowercase DNS hostname.');
          let gateway, access;
          try { gateway = new URL(process.env.GATEWAY_ORIGIN); }
          catch { fail('gateway_origin is not a valid URL.'); }
          try { access = new URL(process.env.ACCESS_TEAM_DOMAIN); }
          catch { fail('access_team_domain is not a valid URL.'); }
          if (gateway.protocol !== 'https:' || gateway.username || gateway.password || gateway.port ||
              gateway.pathname !== '/' || gateway.search || gateway.hash ||
              gateway.hostname === panel || !gateway.hostname.includes('.'))
            fail('gateway_origin must be a different HTTPS hostname, without a port/path/credentials.');
          if (access.protocol !== 'https:' || !access.hostname.endsWith('.cloudflareaccess.com') ||
              access.username || access.password || access.port || access.pathname !== '/' ||
              access.search || access.hash)
            fail('access_team_domain must be a plain Cloudflare Access team HTTPS hostname.');
          const config = JSON.parse(require('node:fs').readFileSync('src/GameServerControl.Cloud/wrangler.jsonc', 'utf8'));
          const databaseId = config.d1_databases?.find(db => db.binding === 'HOSTS_DB')?.database_id;
          if (!/^[0-9a-f-]{36}$/i.test(databaseId || '') || databaseId === '00000000-0000-0000-0000-000000000000')
            fail('wrangler.jsonc must bind the provisioned Cloudflare D1 database.');
          if (Buffer.from(process.env.HOSTS_ENCRYPTION_KEY, 'base64').length !== 32)
            fail('GSC_CF_HOSTS_ENCRYPTION_KEY must be 32 random base64-encoded bytes.');
          if (process.env.GATEWAY_SHARED_KEY.length < 32)
            fail('GSC_CF_GATEWAY_SHARED_KEY must contain at least 32 characters.');
          NODE

      - name: Verify Cloudflare Access protects the panel hostname
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PANEL_HOSTNAME: ${{ inputs.panel_hostname }}
          ACCESS_POLICY_AUD: ${{ inputs.access_policy_aud }}
        run: |
          set -euo pipefail
          apps_file="$(mktemp)"
          trap 'rm -f "$apps_file"' EXIT
          status="$(curl --silent --show-error --output "$apps_file" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?domain=$PANEL_HOSTNAME&exact=true&per_page=100")"
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare Access application lookup failed (HTTP $status)."
            exit 1
          fi
          node - "$apps_file" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const app = (data.result || []).find(item => String(item.domain || '').toLowerCase() === process.env.PANEL_HOSTNAME);
          if (!data.success || !app || String(app.aud) !== process.env.ACCESS_POLICY_AUD) {
            console.error('::error::Protect the exact panel hostname with Access and supply its matching AUD.');
            process.exit(1);
          }
          NODE

      - name: Verify authenticated VPS HTTPS gateway
        shell: bash
        env:
          GATEWAY_ORIGIN: ${{ inputs.gateway_origin }}
          GATEWAY_SHARED_KEY: ${{ secrets.GSC_CF_GATEWAY_SHARED_KEY }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 20 \
            --header "X-GSC-Proxy-Key: $GATEWAY_SHARED_KEY" \
            "$GATEWAY_ORIGIN/_gsc_gateway/health")"
          if [ "$status" != "200" ]; then
            echo "::error::VPS gateway health check failed (HTTP $status). Configure Caddy and TLS first."
            exit 1
          fi
          unauthorized="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 20 \
            "$GATEWAY_ORIGIN/_gsc_gateway/health")"
          if [ "$unauthorized" != "403" ]; then
            echo "::error::VPS gateway does not deny unauthenticated requests."
            exit 1
          fi

      - name: Apply D1 schema and deploy Cloudflare Worker
        shell: bash
        working-directory: src/GameServerControl.Cloud
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOSTS_ENCRYPTION_KEY: ${{ secrets.GSC_CF_HOSTS_ENCRYPTION_KEY }}
          GATEWAY_SHARED_KEY: ${{ secrets.GSC_CF_GATEWAY_SHARED_KEY }}
          ACCESS_ADMIN_EMAILS: ${{ secrets.GSC_CF_ACCESS_ADMIN_EMAILS }}
          GATEWAY_ORIGIN: ${{ inputs.gateway_origin }}
          ACCESS_TEAM_DOMAIN: ${{ inputs.access_team_domain }}
          ACCESS_POLICY_AUD: ${{ inputs.access_policy_aud }}
          PANEL_HOSTNAME: ${{ inputs.panel_hostname }}
        run: |
          set -euo pipefail
          config_file="$(mktemp "$PWD/wrangler.deploy.XXXXXX.jsonc")"
          secrets_file="$(mktemp)"
          trap 'rm -f "$config_file" "$secrets_file"' EXIT

          node - "$config_file" "$secrets_file" <<'NODE'
          const fs = require('node:fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          fs.writeFileSync(process.argv[2], JSON.stringify(cfg), { mode: 0o600 });
          const names = ['GATEWAY_ORIGIN', 'GATEWAY_SHARED_KEY', 'HOSTS_ENCRYPTION_KEY',
            'ACCESS_TEAM_DOMAIN', 'ACCESS_POLICY_AUD', 'ACCESS_ADMIN_EMAILS'];
          const values = Object.fromEntries(names.map(name => [name, process.env[name]]));
          fs.writeFileSync(process.argv[3], JSON.stringify(values), { mode: 0o600 });
          NODE

          npx wrangler d1 migrations apply HOSTS_DB --remote --config "$config_file"
          npx wrangler deploy --strict --config "$config_file" \
            --domain "$PANEL_HOSTNAME" --secrets-file "$secrets_file"

      - name: Deployment summary
        env:
          PANEL_HOSTNAME: ${{ inputs.panel_hostname }}
          GATEWAY_ORIGIN: ${{ inputs.gateway_origin }}
        run: |
          {
            echo '### GameServerControl independent Multi-Agent Cloudflare panel'
            echo "- Panel: https://$PANEL_HOSTNAME"
            echo "- Fixed VPS gateway: $GATEWAY_ORIGIN"
            echo '- Database: D1 with AES-GCM encrypted host credentials'
            echo '- Tunnel/cloudflared: not required'
            echo '- workers.dev and preview URLs: disabled'
          } >> "$GITHUB_STEP_SUMMARY"
