name: Remove runtime Testing guards

on:
  push:
    branches: [test/runtime-integration]
    paths:
      - 'scripts/remove-runtime-testing-guards.py'
      - '.github/workflows/remove-runtime-testing-guards.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: test/runtime-integration

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Remove guards and run runtime suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/remove-runtime-testing-guards.py
          dotnet test tests/GameServerControl.Agent.IntegrationTests/GameServerControl.Agent.IntegrationTests.csproj -c Release
          git diff --check

      - name: Commit and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/remove-runtime-testing-guards.py .github/workflows/remove-runtime-testing-guards.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/GameServerControl.Agent/Program.cs
          git commit -m 'refactor: keep production startup active in integration tests'
          git push origin HEAD:test/runtime-integration
