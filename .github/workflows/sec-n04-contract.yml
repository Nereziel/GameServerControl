name: SEC-N04 platform guard contract

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ca1416-contract:
    name: Agent platform compatibility analyzer
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore Agent
        run: dotnet restore src/GameServerControl.Agent

      - name: Reject unguarded platform-specific APIs
        run: dotnet build src/GameServerControl.Agent -c Release --no-restore -p:WarningsAsErrors=CA1416
