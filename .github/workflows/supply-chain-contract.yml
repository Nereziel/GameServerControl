name: Supply-chain audit contract

on:
  push:
    branches: [fix/audit-supply-chain]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate SUP-01 and SUP-02
        run: node scripts/validate-audit-supply-chain.mjs
