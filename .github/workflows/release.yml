name: Release

# Builds self-contained Windows Agent/Runner + Linux Agent/Web releases, the Linux VPS Relay,
# and the optional Windows tray helper. One-line installers fetch these assets
# from /releases/latest.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag to create from current main (e.g. v1.1.2)'
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release tag, version and source ref
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$SOURCE_REF" != "refs/heads/main" ]; then
              echo "::error::Manual releases must run from main."
              exit 1
            fi
            tag="$INPUT_TAG"
            if git ls-remote --exit-code --tags "https://github.com/${REPOSITORY}.git" "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::Tag ${tag} already exists. Choose a new version; manual releases are built from current main."
              exit 1
            fi
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must look like v1.1.2."
            exit 1
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    needs: prepare
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Validate release tag and repository version format
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/version.mjs check
          node scripts/version.mjs validate-tag "$RELEASE_TAG"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate PowerShell installers
        shell: pwsh
        run: |
          foreach ($script in @('deploy/windows/install.ps1', 'deploy/cloudflare/install-tunnel-windows.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "$script`n$((($parseErrors | ForEach-Object { $_.Message }) -join "`n"))" }
          }
          & ./scripts/validate-windows-updater.ps1

      - name: Validate Linux installers
        run: |
          bash -n deploy/linux/install-from-release.sh
          bash -n deploy/linux/install.sh
          bash -n deploy/relay/install-from-release.sh
          bash -n deploy/relay/install.sh
          bash -n deploy/relay/ufw-reconcile.sh
          bash -n scripts/test-relay-ufw-reconcile.sh

      - name: Test Relay UFW reconciliation
        run: bash scripts/test-relay-ufw-reconcile.sh

      - name: Validate Web UI JavaScript
        run: node scripts/validate-webui.mjs

      - name: Validate ReadOnly Web UI
        run: node scripts/validate-readonly-ui.mjs

      - name: Validate global Settings ownership
        run: node scripts/validate-global-settings.mjs

      - name: Validate mod/plugin management
        run: node scripts/validate-mod-management.mjs

      - name: Validate audit SEC-03 through SEC-06
        run: node scripts/validate-audit-sec03-sec06.mjs

      - name: Validate ARCH-01 Runner isolation
        run: |
          node scripts/validate-arch01-runner.mjs
          dotnet run --project tools/GameServerControl.RunnerCheck -c Release

      - name: Validate backup safety
        run: dotnet run --project tools/GameServerControl.BackupCheck -c Release

      - name: Validate token storage security
        run: dotnet run --project tools/GameServerControl.SecurityCheck -c Release

      - name: Validate Agent security access
        run: node scripts/validate-security-access.mjs

      - name: Validate backup lifecycle
        run: node scripts/validate-backup-lifecycle.mjs

      - name: Validate backup workspace UI
        run: node scripts/validate-backup-ui.mjs

      - name: Validate Valheim + Dragonwilds profile contracts
        run: dotnet run --project tools/GameServerControl.ProfileCheck -c Release

      - name: Validate Cloudflare Worker bundle
        working-directory: src/GameServerControl.Cloud
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          cat > /tmp/gsc-cloud-release-ci-secrets.json <<'JSON'
          {
            "AGENT_ORIGIN": "https://origin.invalid",
            "AGENT_ADMIN_TOKEN": "ci-admin-agent-token",
            "AGENT_READONLY_TOKEN": "ci-readonly-agent-token",
            "ACCESS_ADMIN_EMAILS": "admin@example.invalid",
            "ORIGIN_ACCESS_CLIENT_ID": "ci-client-id",
            "ORIGIN_ACCESS_CLIENT_SECRET": "ci-client-secret",
            "ACCESS_TEAM_DOMAIN": "https://ci.cloudflareaccess.com",
            "ACCESS_POLICY_AUD": "ci-audience"
          }
          JSON
          npx wrangler deploy --dry-run --secrets-file /tmp/gsc-cloud-release-ci-secrets.json --outdir ../../publish/Cloud-worker-release-check
          rm -f /tmp/gsc-cloud-release-ci-secrets.json

  build-windows:
    name: Build Windows agent + runner + tray
    runs-on: windows-latest
    needs: [prepare, validate]
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish agent (win-x64, self-contained)
        run: >-
          dotnet publish src/GameServerControl.Agent -c Release -r win-x64 --self-contained true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:AssemblyVersion=${{ needs.prepare.outputs.version }}.0
          -p:FileVersion=${{ needs.prepare.outputs.version }}.0
          -p:InformationalVersion=${{ needs.prepare.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o publish/Agent-windows

      - name: Publish runner (win-x64, self-contained)
        run: >-
          dotnet publish src/GameServerControl.Runner -c Release -r win-x64 --self-contained true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:AssemblyVersion=${{ needs.prepare.outputs.version }}.0
          -p:FileVersion=${{ needs.prepare.outputs.version }}.0
          -p:InformationalVersion=${{ needs.prepare.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o publish/Runner-windows

      - name: Publish tray helper (win-x64, self-contained)
        run: >-
          dotnet publish src/GameServerControl.Tray -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:AssemblyVersion=${{ needs.prepare.outputs.version }}.0
          -p:FileVersion=${{ needs.prepare.outputs.version }}.0
          -p:InformationalVersion=${{ needs.prepare.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o publish/Tray-windows

      - name: Verify Windows binary versions
        shell: pwsh
        run: |
          $expected = '${{ needs.prepare.outputs.version }}'
          $agent = (Get-Item 'publish/Agent-windows/GameServerControl.Agent.exe').VersionInfo.ProductVersion
          $runner = (Get-Item 'publish/Runner-windows/GameServerControl.Runner.exe').VersionInfo.ProductVersion
          $tray = (Get-Item 'publish/Tray-windows/GameServerControl.Tray.exe').VersionInfo.ProductVersion
          if ($agent -ne $expected) { throw "Agent ProductVersion '$agent' does not match release '$expected'." }
          if ($runner -ne $expected) { throw "Runner ProductVersion '$runner' does not match release '$expected'." }
          if ($tray -ne $expected) { throw "Tray ProductVersion '$tray' does not match release '$expected'." }
          Write-Host "Verified Agent + Runner + Tray version $expected"

      - name: Zip Windows packages
        shell: pwsh
        run: |
          Compress-Archive -Path publish/Agent-windows/* -DestinationPath GameServerControl-Agent-windows.zip
          Compress-Archive -Path publish/Runner-windows/* -DestinationPath GameServerControl-Runner-windows.zip
          Compress-Archive -Path publish/Tray-windows/* -DestinationPath GameServerControl-Tray-windows.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-packages
          retention-days: 1
          path: |
            GameServerControl-Agent-windows.zip
            GameServerControl-Runner-windows.zip
            GameServerControl-Tray-windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux agent + relay
    runs-on: ubuntu-24.04
    needs: [prepare, validate]
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate Linux installers
        run: |
          bash -n deploy/linux/install-from-release.sh
          bash -n deploy/relay/install-from-release.sh
          bash -n deploy/relay/install.sh
          bash -n deploy/relay/ufw-reconcile.sh
          bash -n scripts/test-relay-ufw-reconcile.sh
          bash scripts/test-relay-ufw-reconcile.sh

      - name: Publish agent (linux-x64, self-contained)
        run: >-
          dotnet publish src/GameServerControl.Agent -c Release -r linux-x64 --self-contained true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:AssemblyVersion=${{ needs.prepare.outputs.version }}.0
          -p:FileVersion=${{ needs.prepare.outputs.version }}.0
          -p:InformationalVersion=${{ needs.prepare.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o publish/Agent-linux

      - name: Publish relay (linux-x64, self-contained)
        run: >-
          dotnet publish src/GameServerControl.Relay -c Release -r linux-x64 --self-contained true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:AssemblyVersion=${{ needs.prepare.outputs.version }}.0
          -p:FileVersion=${{ needs.prepare.outputs.version }}.0
          -p:InformationalVersion=${{ needs.prepare.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o publish/Relay-linux

      - name: Stage deploy artifacts
        run: |
          cp deploy/linux/gameservercontrol-agent.service publish/Agent-linux/
          cp deploy/linux/install-from-release.sh publish/Agent-linux/
          chmod +x publish/Agent-linux/install-from-release.sh publish/Agent-linux/GameServerControl.Agent

          cp deploy/relay/gameservercontrol-relay.service publish/Relay-linux/
          cp deploy/relay/install.sh publish/Relay-linux/
          cp deploy/relay/install-from-release.sh publish/Relay-linux/
          cp deploy/relay/ufw-reconcile.sh publish/Relay-linux/
          chmod +x publish/Relay-linux/install.sh publish/Relay-linux/install-from-release.sh publish/Relay-linux/GameServerControl.Relay

      - name: Create Linux tarballs
        run: |
          tar -czf GameServerControl-Agent-linux.tar.gz -C publish/Agent-linux .
          tar -czf GameServerControl-Relay-linux.tar.gz -C publish/Relay-linux .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packages
          retention-days: 1
          path: |
            GameServerControl-Agent-linux.tar.gz
            GameServerControl-Relay-linux.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [prepare, build-windows, build-linux]
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-packages

      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-packages

      - name: Stage installer scripts as release assets
        run: |
          cp deploy/windows/install.ps1                         GameServerControl-Install-Windows.ps1
          cp deploy/cloudflare/install-tunnel-windows.ps1       GameServerControl-Install-Cloudflare-Tunnel-Windows.ps1
          cp deploy/linux/install-from-release.sh               GameServerControl-Install-Linux.sh
          cp deploy/relay/install-from-release.sh               GameServerControl-Install-Relay.sh

      - name: Create SHA-256 manifest
        run: |
          sha256sum \
            GameServerControl-Agent-windows.zip \
            GameServerControl-Runner-windows.zip \
            GameServerControl-Tray-windows.zip \
            GameServerControl-Agent-linux.tar.gz \
            GameServerControl-Relay-linux.tar.gz \
            GameServerControl-Install-Windows.ps1 \
            GameServerControl-Install-Cloudflare-Tunnel-Windows.ps1 \
            GameServerControl-Install-Linux.sh \
            GameServerControl-Install-Relay.sh \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            GameServerControl-Agent-windows.zip
            GameServerControl-Runner-windows.zip
            GameServerControl-Tray-windows.zip
            GameServerControl-Agent-linux.tar.gz
            GameServerControl-Relay-linux.tar.gz
            GameServerControl-Install-Windows.ps1
            GameServerControl-Install-Cloudflare-Tunnel-Windows.ps1
            GameServerControl-Install-Linux.sh
            GameServerControl-Install-Relay.sh
            SHA256SUMS
          body: |
            GameServerControl uses a privileged Windows Agent for host control and per-server low-privilege Runner services for Windows BareMetal game processes. The optional Linux Relay exposes game ports from a public VPS through Tailscale to the game host. Optional Cloudflare remote management exposes the same Web UI through Cloudflare Access and Tunnel without opening the Agent port to the Internet.
            Releases are self-contained; no preinstalled .NET runtime is required on target hosts.

            Install commands:

                # Windows Agent + Runner (admin PowerShell)
                # Download GameServerControl-Install-Windows.ps1 and SHA256SUMS from this release,
                # verify the installer SHA-256, then execute the verified local file:
                powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\GameServerControl-Install-Windows.ps1

                # Linux Agent
                curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/linux/install-from-release.sh | sudo bash

                # Public Linux VPS Relay
                curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/relay/install-from-release.sh | sudo bash

            The Cloudflare Tunnel Windows bootstrap is included as GameServerControl-Install-Cloudflare-Tunnel-Windows.ps1. It requires a remotely-managed Cloudflare Tunnel token and keeps the Agent origin on loopback.

            Release binaries are stamped with version ${{ needs.prepare.outputs.version }} from the release tag. SHA256SUMS binds every published package and installer to this release.
            The Relay installer detects the VPS public interface and Tailscale IPv4, enables IPv4 forwarding, reconciles its Tailscale-only UFW API rule, installs the systemd service, and prints the Tailscale API URL plus token to configure on the Agent.