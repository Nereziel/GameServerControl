name: Release

# Builds self-contained Windows + Linux release artifacts and attaches them to a GitHub Release.
# The in-app updater + one-line installers both fetch from /releases/latest, so the
# asset names below are load-bearing — don't rename without updating the installers.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.8)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish agent (win-x64, self-contained)
        run: dotnet publish src/GameServerControl.Agent -c Release -r win-x64 --self-contained true -o publish/Agent-windows

      - name: Publish client (win-x64, self-contained)
        run: dotnet publish src/GameServerControl.Client -c Release -r win-x64 --self-contained true -o publish/Client-windows

      - name: Zip agent
        run: Compress-Archive -Path publish/Agent-windows/* -DestinationPath GameServerControl-Agent-windows.zip
        shell: pwsh

      - name: Zip client
        run: Compress-Archive -Path publish/Client-windows/* -DestinationPath GameServerControl-Client-windows.zip
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-zips
          path: |
            GameServerControl-Agent-windows.zip
            GameServerControl-Client-windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish agent (linux-x64, self-contained)
        run: dotnet publish src/GameServerControl.Agent -c Release -r linux-x64 --self-contained true -o publish/Agent-linux

      - name: Stage deploy artifacts
        run: |
          cp deploy/linux/gameservercontrol-agent.service publish/Agent-linux/
          cp deploy/linux/install-from-release.sh publish/Agent-linux/
          chmod +x publish/Agent-linux/install-from-release.sh
          chmod +x publish/Agent-linux/GameServerControl.Agent

      - name: Tarball agent
        run: tar -czf GameServerControl-Agent-linux.tar.gz -C publish/Agent-linux .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-tar
          path: GameServerControl-Agent-linux.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-windows, build-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows zips
        uses: actions/download-artifact@v8
        with:
          name: windows-zips

      - name: Download Linux tarball
        uses: actions/download-artifact@v8
        with:
          name: linux-tar

      - name: Stage installer scripts as release assets
        run: |
          cp deploy/windows/install.ps1            GameServerControl-Install-Windows.ps1
          cp deploy/linux/install-from-release.sh  GameServerControl-Install-Linux.sh

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            GameServerControl-Agent-windows.zip
            GameServerControl-Client-windows.zip
            GameServerControl-Agent-linux.tar.gz
            GameServerControl-Install-Windows.ps1
            GameServerControl-Install-Linux.sh
          body: |
            Self-contained release: no preinstalled .NET runtime is required on target hosts.

            Install commands:

                # Windows (admin PowerShell)
                iwr https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/windows/install.ps1 | iex

                # Linux
                curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/linux/install-from-release.sh | sudo bash

            Or download a zip/tarball below and follow the README.
