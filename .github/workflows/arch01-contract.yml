name: ARCH-01 low-privilege runner contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate ARCH-01 Windows Runner architecture
        run: node scripts/validate-arch01-runner.mjs

  protocol-behavior:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Validate Runner protocol behavior
        run: dotnet run --project tools/GameServerControl.RunnerCheck -c Release
      - name: Compile Windows Runner
        run: dotnet build src/GameServerControl.Runner -c Release
