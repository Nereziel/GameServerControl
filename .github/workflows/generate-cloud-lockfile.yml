name: Generate Cloud lockfile (temporary)

on:
  push:
    branches: [fix/audit-supply-chain]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate and commit lockfile when absent
        shell: bash
        run: |
          set -euo pipefail
          lock='src/GameServerControl.Cloud/package-lock.json'
          if [ -f "$lock" ]; then
            echo 'Lockfile already exists; nothing to do.'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix src/GameServerControl.Cloud
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$lock"
          git commit -m 'build: lock Cloud Worker dependencies'
          git push origin HEAD:fix/audit-supply-chain
