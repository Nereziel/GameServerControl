name: Apply ARCH-01 live console pump

on:
  push:
    branches: [fix/arch01-low-priv-runner]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/arch01-low-priv-runner
      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Apply and verify live console forwarding
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/arch01-console-apply.py
          node scripts/validate-arch01-runner.mjs
          dotnet build src/GameServerControl.Agent -c Release

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/GameServerControl.Agent/Hyperv/LocalProcessService.cs src/GameServerControl.Agent/Hyperv/WindowsRunnerServiceManager.cs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: forward live Runner console output through SignalR'
          git push origin HEAD:fix/arch01-low-priv-runner
