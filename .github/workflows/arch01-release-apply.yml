name: Apply ARCH-01 installer integration

on:
  push:
    branches: [fix/arch01-low-priv-runner]

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/arch01-low-priv-runner
      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Apply and verify installer integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/arch01-release-apply.py
          if ($LASTEXITCODE -ne 0) { throw "ARCH-01 installer transform failed with exit code $LASTEXITCODE." }

          $installer = Get-Content -LiteralPath 'deploy/windows/install.ps1' -Raw
          $installer = $installer.Replace('access to $serviceAccount:', 'access to ${serviceAccount}:')
          Set-Content -LiteralPath 'deploy/windows/install.ps1' -Value $installer -Encoding UTF8

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('deploy/windows/install.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw (($parseErrors | ForEach-Object { $_.Message }) -join "`n") }

          node scripts/validate-arch01-runner.mjs
          if ($LASTEXITCODE -ne 0) { throw "ARCH-01 contract failed." }
          & ./scripts/validate-windows-updater.ps1
          dotnet build src/GameServerControl.Agent -c Release
          dotnet build src/GameServerControl.Runner -c Release

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/windows/install.ps1
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'build: install and roll back Windows Runner with Agent'
          git push origin HEAD:fix/arch01-low-priv-runner
