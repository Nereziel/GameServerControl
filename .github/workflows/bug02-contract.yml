name: BUG-02 update health contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate BUG-02 contract
        run: node scripts/validate-update-health.mjs

      - name: Compile Agent with BUG-02 auth path
        run: dotnet build src/GameServerControl.Agent -c Release
