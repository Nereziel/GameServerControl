name: SEC-07 temporary patch applier

on:
  push:
    branches: [fix/audit-sec07-webui-csp]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/audit-sec07-webui-csp

      - name: Apply deterministic WebUI patches
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for gz in .github/sec07-patches/*.patch.gz; do
            patch_file="$(mktemp)"
            gzip -dc "$gz" > "$patch_file"
            if git apply --check "$patch_file"; then
              git apply "$patch_file"
              changed=1
            fi
            rm -f "$patch_file"
          done
          if [[ "$changed" -eq 0 ]]; then
            echo "No source patch needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/GameServerControl.Agent/WebUi/config-backups.js \
                  src/GameServerControl.Agent/WebUi/jobs-mods.js \
                  src/GameServerControl.Agent/WebUi/server-admin.js \
                  src/GameServerControl.Agent/WebUi/server-workspace.js
          git commit -m 'fix: apply SEC-07 WebUI handler refactor'
          git push origin HEAD:fix/audit-sec07-webui-csp
