name: Dispatch release v1.1.2

on:
  push:
    branches:
      - test/runtime-integration
    paths:
      - '.github/workflows/dispatch-release-v1.1.2.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch v1.1.2 release from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.1.2
