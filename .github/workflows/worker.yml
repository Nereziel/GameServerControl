name: Worker

on:
  push:
    branches: [main, master]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Cloudflare Worker (Node 24)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Wrangler
        run: npm install --ignore-scripts

      - name: Validate Worker bundle
        shell: bash
        run: |
          cat > /tmp/gsc-worker-secrets.json <<'JSON'
          {
            "GATEWAY_BASE_URL": "https://gateway.invalid",
            "GATEWAY_SECRET": "ci-placeholder",
            "WINDOWS_AGENT_TOKEN": "ci-placeholder"
          }
          JSON
          npx wrangler deploy --dry-run --secrets-file /tmp/gsc-worker-secrets.json --outdir .wrangler-dry-run
