name: Apply PERF implementation

on:
  push:
    branches: [fix/audit-perf01-perf02]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/audit-perf01-perf02
      - name: Apply scoped changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace('src/GameServerControl.Agent/Hubs/StatusHub.cs',
          '''    private readonly LocalProcessService _local;\n\n    public StatusHub''',
          '''    private readonly LocalProcessService _local;\n\n    public static string ServerGroup(string serverId) => "server:" + serverId;\n\n    public StatusHub''')

          replace('src/GameServerControl.Agent/Hubs/StatusHub.cs',
          '''        var def = _registry.Get(serverId);\n        if (def is null) throw new HubException("Unknown server.");\n\n        var profile = GameProfiles.FindFor(def);''',
          '''        var def = _registry.Get(serverId);\n        if (def is null) throw new HubException("Unknown server.");\n\n        await Groups.AddToGroupAsync(Context.ConnectionId, ServerGroup(serverId), Context.ConnectionAborted);\n\n        var profile = GameProfiles.FindFor(def);''')

          replace('src/GameServerControl.Agent/Logs/LogTailService.cs',
          '''        try { await _hub.Clients.All.SendAsync("logLine", line); }''',
          '''        try { await _hub.Clients.Group(StatusHub.ServerGroup(serverId)).SendAsync("logLine", line); }''')

          replace('src/GameServerControl.Agent/Hyperv/LocalProcessService.cs',
          '''        try { await _hub.Clients.All.SendAsync("logLine", line); }''',
          '''        try { await _hub.Clients.Group(StatusHub.ServerGroup(session.ServerId)).SendAsync("logLine", line); }''')

          replace('src/GameServerControl.Agent/WebUi/server-workspace.js',
          '''  if (readOnly) {\n    await api(`/api/servers/${encodeURIComponent(def.id)}/logs/tail`, { method: 'POST', body: JSON.stringify({ action: 'start' }) });\n    SERVER_WORKSPACE.console = {\n      close() {\n        connection.close();\n        api(`/api/servers/${encodeURIComponent(def.id)}/logs/tail`, { method: 'POST', body: JSON.stringify({ action: 'stop' }) }).catch(() => {});\n      }\n    };\n  } else {\n    SERVER_WORKSPACE.console = connection;\n    await connection.invoke('SubscribeConsole', [def.id]);\n  }''',
          '''  await connection.invoke('SubscribeConsole', [def.id]);\n  if (readOnly) {\n    await api(`/api/servers/${encodeURIComponent(def.id)}/logs/tail`, { method: 'POST', body: JSON.stringify({ action: 'start' }) });\n    SERVER_WORKSPACE.console = {\n      close() {\n        connection.close();\n        api(`/api/servers/${encodeURIComponent(def.id)}/logs/tail`, { method: 'POST', body: JSON.stringify({ action: 'stop' }) }).catch(() => {});\n      }\n    };\n  } else {\n    SERVER_WORKSPACE.console = connection;\n  }''')

          helper = Path('src/GameServerControl.Agent/Servers/InstallJobRetention.cs')
          if not helper.exists():
              helper.write_text('''using GameServerControl.Shared;\n\nnamespace GameServerControl.Agent.Servers;\n\npublic static class InstallJobRetention\n{\n    public static readonly TimeSpan CompletedTtl = TimeSpan.FromHours(24);\n    public const int MaxCompletedJobs = 100;\n\n    public static IReadOnlyList<string> SelectEvictions(\n        IEnumerable<InstallProgress> snapshots,\n        DateTimeOffset now)\n    {\n        var cutoff = now - CompletedTtl;\n        var completed = snapshots\n            .Where(snapshot => snapshot.Finished)\n            .Select(snapshot => new Candidate(\n                snapshot.JobId,\n                snapshot.UpdatedAt ?? snapshot.StartedAt ?? DateTimeOffset.MinValue))\n            .ToArray();\n\n        var evictions = completed\n            .Where(candidate => candidate.UpdatedAt <= cutoff)\n            .Select(candidate => candidate.JobId)\n            .ToHashSet(StringComparer.Ordinal);\n\n        var retained = completed\n            .Where(candidate => !evictions.Contains(candidate.JobId))\n            .OrderByDescending(candidate => candidate.UpdatedAt)\n            .ThenBy(candidate => candidate.JobId, StringComparer.Ordinal)\n            .ToArray();\n\n        foreach (var candidate in retained.Skip(MaxCompletedJobs))\n            evictions.Add(candidate.JobId);\n\n        return evictions.OrderBy(id => id, StringComparer.Ordinal).ToArray();\n    }\n\n    private sealed record Candidate(string JobId, DateTimeOffset UpdatedAt);\n}\n''')

          replace('src/GameServerControl.Agent/Servers/ServerInstaller.cs',
          '''    public InstallProgress? Get(string jobId)\n    {\n        if (!_jobs.TryGetValue(jobId, out var state)) return null;''',
          '''    public InstallProgress? Get(string jobId)\n    {\n        PruneCompletedJobs();\n        if (!_jobs.TryGetValue(jobId, out var state)) return null;''')

          replace('src/GameServerControl.Agent/Servers/ServerInstaller.cs',
          '''    public string StartJob(InstallServerRequest request)\n    {\n        var req = NormalizeForHost(request);''',
          '''    public string StartJob(InstallServerRequest request)\n    {\n        PruneCompletedJobs();\n        var req = NormalizeForHost(request);''')

          replace('src/GameServerControl.Agent/Servers/ServerInstaller.cs',
          '''        try { await _hub.Clients.All.SendAsync("installProgress", snapshot); }\n        catch (Exception ex) { _logger.LogDebug(ex, "Install progress SignalR broadcast failed for {JobId}", jobId); }\n    }\n\n    private static string GameKey''',
          '''        try { await _hub.Clients.All.SendAsync("installProgress", snapshot); }\n        catch (Exception ex) { _logger.LogDebug(ex, "Install progress SignalR broadcast failed for {JobId}", jobId); }\n\n        if (finished) PruneCompletedJobs();\n    }\n\n    private void PruneCompletedJobs()\n    {\n        var snapshots = new List<InstallProgress>(_jobs.Count);\n        foreach (var state in _jobs.Values)\n        {\n            lock (state.Gate) snapshots.Add(state.Snapshot);\n        }\n\n        foreach (var jobId in InstallJobRetention.SelectEvictions(snapshots, DateTimeOffset.UtcNow))\n            _jobs.TryRemove(jobId, out _);\n    }\n\n    private static string GameKey''')

          replace('tools/GameServerControl.PerformanceCheck/GameServerControl.PerformanceCheck.csproj',
          '''    <ProjectReference Include="../../src/GameServerControl.Shared/GameServerControl.Shared.csproj" />\n  </ItemGroup>''',
          '''    <ProjectReference Include="../../src/GameServerControl.Shared/GameServerControl.Shared.csproj" />\n    <Compile Include="../../src/GameServerControl.Agent/Servers/InstallJobRetention.cs" Link="InstallJobRetention.cs" />\n  </ItemGroup>''')
          PY

          node scripts/validate-perf01-perf02.mjs
          dotnet run --project tools/GameServerControl.PerformanceCheck -c Release
          node --check src/GameServerControl.Agent/WebUi/server-workspace.js
          dotnet build src/GameServerControl.Agent -c Release

          if git diff --quiet; then
            echo 'No implementation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/GameServerControl.Agent tools/GameServerControl.PerformanceCheck
          git commit -m 'fix: scope console traffic and bound install jobs'
          git push origin HEAD:fix/audit-perf01-perf02
