<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0b0d10" />
<title>GameServerControl</title>
<link rel="stylesheet" href="/webui/styles.css?v=__GSC_ASSET_VERSION__" />

</head>

<body>
<div id="login" class="login hidden">
  <h1>GameServerControl</h1><div class="muted">Connect this browser to the Agent.</div>
  <div class="field"><label>Agent URL</label><input id="loginUrl"></div>
  <div class="field"><label>API token</label><input id="loginToken" type="password" autocomplete="off"></div>
  <button id="loginConnectBtn" class="btn primary" style="width:100%">Connect</button>
</div>
<div id="app" class="hidden">
  <div class="top">
    <div class="brand">GameServer<span>Control</span></div><div id="agentLabel" class="tiny muted hide-sm"></div><div class="spacer"></div>
    <button id="updateBtn" class="btn hidden">Update</button>
    <button id="createServerBtn" class="btn primary">＋ Create server</button>
    <button id="discoverBtn" class="btn">Discover</button>
    <button id="addExistingBtn" class="btn">Add existing</button>
    <button id="tokensBtn" class="btn hide-sm">Tokens</button>
    <button id="refreshBtn" class="btn">Refresh</button>
    <button id="logoutBtn" class="btn hide-sm">Sign out</button>
  </div>
  <div class="shell">
    <div class="tabs"><button id="tabServers" class="tab active">Servers</button><button id="tabInstalls" class="tab">Installations <span id="installBadge" class="badge hidden">0</span></button></div>
    <div id="noticeBar" class="noticebar hidden"><strong id="noticeTitle">Status</strong><span id="noticeText" class="grow"></span><button id="noticeCloseBtn" class="btn" style="padding:4px 8px">×</button></div>
    <section id="serversView"><div id="servers"></div></section>
    <section id="installsView" class="hidden"><div class="summarybar"><div class="muted tiny">Install jobs keep running when this page is closed. Active jobs stream their log continuously.</div><div class="spacer"></div><button id="clearFinishedJobsBtn" class="btn">Clear finished</button></div><div id="jobs"></div></section>
  </div>
</div>
<div id="overlay" class="overlay hidden">
  <div id="modal" class="modal"><div class="modalhead"><h2 id="modalTitle">Dialog</h2><div class="spacer"></div><button id="modalCloseBtn" class="btn">Close</button></div><div id="modalBody" class="modalbody"></div><div id="modalFoot" class="modalfoot"></div></div>
</div>
<div id="toast" class="toast"></div>

<!-- Scripts are at the end of body, so they do not need defer. core loads first and contains
     the control-room overrides before the feature modules perform their immediate boot. -->
<script src="/webui/core.js?v=__GSC_ASSET_VERSION__"></script>
<script src="/webui/server-admin.js?v=__GSC_ASSET_VERSION__"></script>
<script src="/webui/jobs-mods.js?v=__GSC_ASSET_VERSION__"></script>
<script src="/webui/config-backups.js?v=__GSC_ASSET_VERSION__"></script>
<script src="/webui/server-workspace.js?v=__GSC_ASSET_VERSION__"></script>

</body>
</html>
