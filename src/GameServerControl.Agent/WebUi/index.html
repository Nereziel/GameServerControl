<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0b0d10" />
<title>GameServerControl</title>
<link rel="stylesheet" href="/webui/styles.css" />
</head>

<body>
<div id="login" class="login hidden">
  <h1>GameServerControl</h1><div class="muted">Connect this browser to the Agent.</div>
  <div class="field"><label>Agent URL</label><input id="loginUrl"></div>
  <div class="field"><label>API token</label><input id="loginToken" type="password" autocomplete="off"></div>
  <button class="btn primary" style="width:100%" onclick="login()">Connect</button>
</div>
<div id="app" class="hidden">
  <div class="top">
    <div class="brand">GameServer<span>Control</span></div><div id="agentLabel" class="tiny muted hide-sm"></div><div class="spacer"></div>
    <button id="updateBtn" class="btn hidden" onclick="openUpdate()">Update</button>
    <button class="btn primary" onclick="openCreate()">＋ Create server</button>
    <button class="btn" onclick="openDiscover()">Discover</button>
    <button class="btn" onclick="openAddExisting()">Add existing</button>
    <button class="btn hide-sm" onclick="openTokens()">Tokens</button>
    <button class="btn" onclick="refreshAll()">Refresh</button>
    <button class="btn hide-sm" onclick="logout()">Sign out</button>
  </div>
  <div class="shell">
    <div class="tabs"><button id="tabServers" class="tab active" onclick="showView('servers')">Servers</button><button id="tabInstalls" class="tab" onclick="showView('installs')">Installations <span id="installBadge" class="badge hidden">0</span></button></div>
    <section id="serversView"><div id="servers"></div></section>
    <section id="installsView" class="hidden"><div class="summarybar"><div class="muted tiny">Install jobs keep running when this page is closed. This browser remembers their IDs.</div><div class="spacer"></div><button class="btn" onclick="clearFinishedJobs()">Clear finished</button></div><div id="jobs"></div></section>
  </div>
</div>
<div id="overlay" class="overlay hidden" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"><div class="modalhead"><h2 id="modalTitle">Dialog</h2><div class="spacer"></div><button class="btn" onclick="closeModal()">Close</button></div><div id="modalBody" class="modalbody"></div><div id="modalFoot" class="modalfoot"></div></div>
</div>
<div id="toast" class="toast"></div>
<script src="/webui/core.js" defer></script>
<script src="/webui/server-admin.js" defer></script>
<script src="/webui/jobs-mods.js" defer></script>
<script src="/webui/config-backups.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  window.deleteServer = function(id) {
    const d = SERVERS.find(x => x.id === id);
    if (!d) return;
    const bareMetal = d.hostingMode !== 'Vm';
    const hasSaves = Array.isArray(d.saveDirs) && d.saveDirs.length > 0;
    const permanent = bareMetal
      ? `<div class="section">Delete server completely</div>
         <div class="callout">This permanently stops the server and deletes the entire server folder. This cannot be undone.</div>
         <div class="kv compact"><div>Folder to delete</div><div class="mono">${esc(d.guestWorkingDir || '')}</div></div>
         <div class="checkrow" style="margin-top:14px"><input id="deleteFinalBackup" type="checkbox" ${hasSaves ? 'checked' : 'disabled'}><label for="deleteFinalBackup">Create a final save backup before deletion${hasSaves ? '' : ' (no save folders configured)'}</label></div>
         <div class="field"><label>Type the exact server name to confirm</label><input id="deleteConfirm" autocomplete="off" placeholder="${esc(d.name)}" oninput="syncPermanentDeleteButton('${jsq(id)}')"><div class="help">Required: <b>${esc(d.name)}</b></div></div>
         <button id="permanentDeleteBtn" class="btn danger" disabled onclick="permanentDeleteServer('${jsq(id)}')">Permanently delete server and files</button>`
      : `<div class="section">Delete server completely</div><div class="callout info">Complete file deletion is disabled for Hyper-V servers because the server folder is inside the guest VM. Remove the definition here and manage VM files separately.</div>`;

    openModal('Delete — ' + d.name,
      `<div class="section">Remove from GameServerControl</div>
       <div class="help">Removes only the server definition. All game files and saves remain untouched.</div>
       <button class="btn" onclick="removeServerOnly('${jsq(id)}')">Remove only</button>
       ${permanent}`,
      '<button class="btn" onclick="closeModal()">Cancel</button>', true);
  };

  window.removeServerOnly = async function(id) {
    const d = SERVERS.find(x => x.id === id);
    if (!confirm(`Remove "${d?.name || id}" from GameServerControl?\n\nServer files will remain untouched.`)) return;
    try {
      await api(`/api/servers/${encodeURIComponent(id)}`, { method: 'DELETE' });
      toast('Server removed from GameServerControl. Files were kept.', 'ok');
      closeModal();
      await loadServers();
    } catch (e) {
      toast('Remove failed: ' + e.message, 'err');
    }
  };

  window.syncPermanentDeleteButton = function(id) {
    const d = SERVERS.find(x => x.id === id);
    const input = $('#deleteConfirm');
    const button = $('#permanentDeleteBtn');
    if (button) button.disabled = !d || !input || input.value !== d.name;
  };

  window.permanentDeleteServer = async function(id) {
    const d = SERVERS.find(x => x.id === id);
    if (!d) return;
    const confirmation = $('#deleteConfirm')?.value || '';
    if (confirmation !== d.name) return toast('Type the exact server name first.', 'err');
    const createFinalBackup = !!$('#deleteFinalBackup')?.checked;
    const button = $('#permanentDeleteBtn');
    if (button) { button.disabled = true; button.textContent = 'Deleting…'; }
    try {
      const result = await api(`/api/servers/${encodeURIComponent(id)}/delete-completely`, {
        method: 'POST',
        body: JSON.stringify({ confirmation, createFinalBackup })
      });
      toast(result.message || 'Server permanently deleted.', 'ok');
      closeModal();
      await loadServers();
    } catch (e) {
      toast('Permanent deletion cancelled/failed: ' + e.message, 'err');
      if (button) { button.textContent = 'Permanently delete server and files'; syncPermanentDeleteButton(id); }
    }
  };
});
</script>
</body>
</html>
