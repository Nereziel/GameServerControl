<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0b0d10" />
<title>GameServerControl</title>
<style>
:root{--bg:#0b0d10;--panel:#14171c;--panel2:#1a1e25;--line:#2a3039;--text:#eef1f5;--muted:#8e98a7;--accent:#e0294a;--accent2:#9f1d35;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--info:#58a6ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{height:64px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(20,23,28,.96);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px}.brand span{color:var(--accent)}.spacer{flex:1}.muted{color:var(--muted)}.tiny{font-size:12px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:8px 12px;font-weight:650}.btn:hover{border-color:#4b5665}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}.btn.danger:hover{border-color:var(--bad);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.shell{max-width:1280px;margin:0 auto;padding:20px}.tabs{display:flex;gap:6px;margin-bottom:18px}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:8px 13px;font-weight:700}.tab.active{background:var(--panel2);color:var(--text)}.badge{display:inline-flex;min-width:20px;height:20px;align-items:center;justify-content:center;border-radius:10px;padding:0 6px;background:var(--accent);color:#fff;font-size:11px;margin-left:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:16px}.cardhead{display:flex;gap:11px;align-items:flex-start}.icon{font-size:26px;width:34px;text-align:center}.grow{flex:1;min-width:0}.title{font-size:16px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.state{font-size:11px;font-weight:800;border:1px solid var(--line);border-radius:12px;padding:3px 8px}.state.up{border-color:rgba(63,185,80,.45);color:var(--ok);background:rgba(63,185,80,.08)}.state.down{color:var(--muted)}.state.warn{color:var(--warn)}
.metrics{display:flex;gap:14px;margin:13px 0;color:var(--muted);font-size:12px}.metrics b{color:var(--text);font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.actions .btn{padding:7px 10px;font-size:12px}.empty{border:1px dashed var(--line);border-radius:10px;padding:50px 20px;text-align:center;color:var(--muted)}
.job{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:15px;margin-bottom:10px}.jobtop{display:flex;align-items:flex-start;gap:10px}.jobname{font-weight:800}.jobphase{font-size:12px;color:var(--muted)}.progress{height:9px;background:#262b33;border-radius:6px;overflow:hidden;margin:12px 0 8px}.bar{height:100%;background:var(--accent);width:0;transition:width .25s}.job.finished .bar{background:var(--ok)}.job.failed .bar{background:var(--bad)}.jobline{font:12px/1.4 Consolas,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.jobbuttons{display:flex;gap:7px;margin-top:11px}
.login{width:min(420px,calc(100% - 32px));margin:10vh auto;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:24px}.login h1{margin:0 0 7px;font-size:21px}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.55px;font-weight:750;margin-bottom:5px}.input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0f1216;color:var(--text);border-radius:7px;padding:9px 10px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#596577}.help{color:var(--muted);font-size:11px;margin-top:5px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.45)}.modal.wide{width:min(920px,100%)}.modalhead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--panel);z-index:3}.modalhead h2{font-size:16px;margin:0}.modalbody{padding:17px}.modalfoot{padding:13px 17px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--panel)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}.game{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:12px;text-align:left;color:var(--text)}.game:hover{border-color:#576170}.game .gicon{font-size:23px}.game .gname{font-weight:800;margin-top:5px}.game .gmeta{font-size:11px;color:var(--muted);margin-top:2px}.callout{border:1px solid #49323a;background:#1a1316;border-radius:8px;padding:10px 12px;color:#d8b8c0;font-size:12px;margin:12px 0}.section{margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);font-weight:800}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.checkrow{display:flex;align-items:center;gap:8px;padding:7px 0}.checkrow input{width:auto}.log{background:#090b0e;border:1px solid var(--line);border-radius:7px;padding:11px;min-height:220px;max-height:420px;overflow:auto;white-space:pre-wrap;font:11px/1.45 Consolas,monospace;color:#aeb7c4}.toast{position:fixed;right:18px;bottom:18px;max-width:430px;background:#1c2027;border:1px solid var(--line);border-radius:8px;padding:10px 13px;z-index:80;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}.toast.ok{border-color:var(--ok)}.toast.err{border-color:var(--bad)}
@media(max-width:700px){.top{padding:0 10px}.top .tiny,.hide-sm{display:none}.shell{padding:12px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.btn{padding:8px 9px}.brand{font-size:15px}}
</style>
</head>
<body>
<div id="login" class="login hidden">
  <h1>GameServerControl</h1>
  <div class="muted">Connect this browser to the local agent.</div>
  <div class="field"><label>Agent URL</label><input id="loginUrl" class="input" /></div>
  <div class="field"><label>API token</label><input id="loginToken" class="input" type="password" autocomplete="off" /></div>
  <button class="btn primary" style="width:100%" onclick="login()">Connect</button>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div class="brand">GameServer<span>Control</span></div>
    <div id="agentLabel" class="tiny muted hide-sm"></div>
    <div class="spacer"></div>
    <button class="btn primary" onclick="openCreate()">＋ Create server</button>
    <button class="btn" onclick="refreshAll()">Refresh</button>
    <button class="btn hide-sm" onclick="logout()">Sign out</button>
  </div>
  <div class="shell">
    <div class="tabs">
      <button id="tabServers" class="tab active" onclick="showView('servers')">Servers</button>
      <button id="tabInstalls" class="tab" onclick="showView('installs')">Installations <span id="installBadge" class="badge hidden">0</span></button>
    </div>
    <section id="serversView"><div id="servers"></div></section>
    <section id="installsView" class="hidden">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <div class="muted tiny">Install jobs keep running when this page is closed. This browser remembers their IDs and reconnects after refresh.</div>
        <div class="spacer"></div>
        <button class="btn" onclick="clearFinishedJobs()">Clear finished</button>
      </div>
      <div id="jobs"></div>
    </section>
  </div>
</div>

<div id="overlay" class="overlay hidden" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal">
    <div class="modalhead"><h2 id="modalTitle">Dialog</h2><div class="spacer"></div><button class="btn" onclick="closeModal()">Close</button></div>
    <div id="modalBody" class="modalbody"></div>
    <div id="modalFoot" class="modalfoot"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CFG={url:'',token:''},SERVERS=[],STATUS={},CURRENT_VIEW='servers',JOB_CACHE={};
const CFG_KEY='gsc.connection.v2';
const gameLabel={
 '896660':['⚔','Valheim'],'4019830':['🐉','RuneScape: Dragonwilds'],'2394010':['🐾','Palworld'],'1690800':['⚙','Satisfactory'],
 '2430930':['🦖','ARK: Survival Ascended'],'376030':['🦖','ARK: Survival Evolved'],'258550':['🔧','Rust'],'1829350':['🩸','V Rising'],
 '443030':['🗿','Conan Exiles'],'403240':['🎯','Squad'],'3017310':['🗿','Soulmask'],'294420':['🧟','7 Days to Die'],
 '105600':['🌳','Terraria'],'343050':['❄','Don\'t Starve Together'],'380870':['🧟','Project Zomboid']};
const GAMES=[
 {key:'valheim',label:'Valheim',icon:'⚔',appId:'896660',size:'~1 GB',dir:'Valheim',exe:'valheim_server.exe',args:['-nographics','-batchmode','-name','MyServer','-port','2456','-world','MyWorld','-password','secret'],note:'SteamCMD dedicated server.'},
 {key:'dragonwilds',label:'RuneScape: Dragonwilds',icon:'🐉',appId:'4019830',size:'~6 GB',dir:'Dragonwilds',exe:'RSDragonwilds.exe',args:['-log','-NewConsole'],saveRel:['RSDragonwilds\\Saved\\Savegames'],logRel:'RSDragonwilds\\Saved\\Logs\\RSDragonwilds.log',note:'Dedicated server preset with managed INI configuration.'},
 {key:'palworld',label:'Palworld',icon:'🐾',appId:'2394010',size:'~7 GB',dir:'PalServer',exe:'PalServer\\PalServer.exe',args:['-useperfthreads','-NoAsyncLoadingThread','-UseMultithreadForDS','EpicApp=PalServer'],saveRel:['Pal\\Saved']},
 {key:'satisfactory',label:'Satisfactory',icon:'⚙',appId:'1690800',size:'~12 GB',dir:'Satisfactory',exe:'FactoryServer.exe',args:['-log','-unattended']},
 {key:'ark-asa',label:'ARK: Survival Ascended',icon:'🦖',appId:'2430930',size:'~50 GB',dir:'ArkAscended',exe:'ShooterGame\\Binaries\\Win64\\ArkAscendedServer.exe',args:['TheIsland_WP?listen?MaxPlayers=20?ServerPassword=?ServerAdminPassword=changeme'],saveRel:['ShooterGame\\Saved']},
 {key:'ark-se',label:'ARK: Survival Evolved',icon:'🦖',appId:'376030',size:'~14 GB',dir:'ArkSE',exe:'ShooterGame\\Binaries\\Win64\\ShooterGameServer.exe',args:['TheIsland?listen?MaxPlayers=20?ServerAdminPassword=changeme','-server','-log'],saveRel:['ShooterGame\\Saved']},
 {key:'rust',label:'Rust',icon:'🔧',appId:'258550',size:'~8 GB',dir:'Rust',exe:'RustDedicated.exe',args:['-batchmode','+server.port','28015','+rcon.port','28016','+rcon.password','changeme','+server.hostname','My Rust Server'],saveRel:['server']},
 {key:'vrising',label:'V Rising',icon:'🩸',appId:'1829350',size:'~3 GB',dir:'VRising',exe:'VRisingServer.exe',args:['-persistentDataPath','.\\save-data','-serverName','My V Rising Server','-saveName','world1','-logFile','.\\logs\\VRisingServer.log'],saveRel:['save-data']},
 {key:'conan',label:'Conan Exiles',icon:'🗿',appId:'443030',size:'~50 GB',dir:'ConanServer',exe:'ConanSandboxServer.exe',args:['-log','-MULTIHOME=0.0.0.0','-Port=7777','-QueryPort=27015'],saveRel:['ConanSandbox\\Saved']},
 {key:'squad',label:'Squad',icon:'🎯',appId:'403240',size:'~40 GB',dir:'SquadServer',exe:'SquadGameServer.exe',args:['-log','-Port=7787','-QueryPort=27165','-MultiHome=0.0.0.0'],saveRel:['SquadGame\\Saved']},
 {key:'soulmask',label:'Soulmask',icon:'🗿',appId:'3017310',size:'~20 GB',dir:'SoulmaskServer',exe:'WS\\Binaries\\Win64\\WSServer.exe',args:['-log','Level01_Main','-server','-SteamServerName=My Soulmask Server'],saveRel:['WS\\Saved']},
 {key:'7dtd',label:'7 Days to Die',icon:'🧟',appId:'294420',size:'~2 GB',dir:'SevenDaysToDie',exe:'7DaysToDieServer.exe',args:['-quit','-batchmode','-nographics','-configfile=serverconfig.xml']},
 {key:'terraria',label:'Terraria',icon:'🌳',appId:'105600',size:'~0.5 GB',dir:'Terraria',exe:'TerrariaServer.exe',args:['-config','serverconfig.txt'],note:'SteamCMD is tried first. If it leaves an incomplete install, GameServerControl automatically falls back to the official Re-Logic Terraria Server 1.4.5.8 package.'},
 {key:'dst',label:"Don't Starve Together",icon:'❄',appId:'343050',size:'~1 GB',dir:'DST',exe:'bin\\dontstarve_dedicated_server_nullrenderer.exe',args:['-console','-cluster','MyCluster','-shard','Master']},
 {key:'zomboid',label:'Project Zomboid',icon:'🧟',appId:'380870',size:'~1 GB',dir:'ProjectZomboid',exe:'StartServer64.bat',args:[]}
];

function toast(msg,kind=''){const t=$('#toast');t.textContent=msg;t.className='toast show '+kind;clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='toast',3200)}
async function api(path,opts={}){const h={Authorization:'Bearer '+CFG.token,...(opts.headers||{})};if(opts.body)h['Content-Type']='application/json';const r=await fetch(CFG.url+path,{...opts,headers:h});const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch{data=txt}if(!r.ok)throw new Error((data&&data.error)||data||`${r.status} ${r.statusText}`);return data}
function jobKey(){return 'gsc.install.jobs.'+CFG.url}
function loadJobRefs(){try{return JSON.parse(localStorage.getItem(jobKey())||'[]')}catch{return[]}}
function saveJobRefs(v){localStorage.setItem(jobKey(),JSON.stringify(v.slice(0,30)))}
function rememberJob(meta){const a=loadJobRefs().filter(x=>x.jobId!==meta.jobId);a.unshift(meta);saveJobRefs(a)}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function joinPath(root,rel){return root.replace(/[\\/]+$/,'')+'\\'+rel.replace(/^[\\/]+/,'')}

function openModal(title,body,foot='',wide=false){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot;$('#modal').classList.toggle('wide',wide);$('#overlay').classList.remove('hidden')}
function closeModal(){$('#overlay').classList.add('hidden')}
function showView(v){CURRENT_VIEW=v;$('#serversView').classList.toggle('hidden',v!=='servers');$('#installsView').classList.toggle('hidden',v!=='installs');$('#tabServers').classList.toggle('active',v==='servers');$('#tabInstalls').classList.toggle('active',v==='installs');if(v==='installs')refreshJobs()}

async function login(){const url=$('#loginUrl').value.trim().replace(/\/+$/,'');const token=$('#loginToken').value.trim();if(!url||!token)return toast('Agent URL and token are required.','err');CFG={url,token};try{await api('/api/health');localStorage.setItem(CFG_KEY,JSON.stringify(CFG));boot()}catch(e){toast('Connection failed: '+e.message,'err')}}
function logout(){localStorage.removeItem(CFG_KEY);location.reload()}
async function boot(){
 $('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#agentLabel').textContent='· '+CFG.url;
 await refreshAll();setInterval(()=>{loadServers();refreshJobs(false)},5000);setInterval(()=>refreshJobs(false),2000);
}
async function refreshAll(){await Promise.allSettled([loadServers(),refreshJobs(false)]);}

async function loadServers(){
 try{const [s,st]=await Promise.all([api('/api/servers'),api('/api/status')]);SERVERS=s||[];STATUS={};for(const x of(st||[]))STATUS[x.id]=x;renderServers()}
 catch(e){toast('Refresh failed: '+e.message,'err')}
}
function serverMeta(def){const a=gameLabel[def.steamAppId]||['🖥',def.gameType||'Server'];return{icon:a[0],label:a[1]}}
function renderServers(){
 const root=$('#servers');if(!SERVERS.length){root.innerHTML='<div class="empty">No servers registered yet.<br><br><button class="btn primary" onclick="openCreate()">Create your first server</button></div>';return}
 root.innerHTML='<div class="grid">'+SERVERS.map(d=>{const s=STATUS[d.id]||{};const m=serverMeta(d);const up=s.processState==='Running';const busy=['Starting','Stopping'].includes(s.processState);return `<div class="card">
  <div class="cardhead"><div class="icon">${m.icon}</div><div class="grow"><div class="title">${esc(d.name)}</div><div class="sub">${esc(m.label)} · ${esc(d.guestWorkingDir||'')}</div></div><div class="state ${up?'up':busy?'warn':'down'}">${esc(s.processState||'Unknown')}</div></div>
  <div class="metrics"><span>PID <b>${s.pidInGuest??'—'}</b></span><span>CPU <b>${s.cpuPercent!=null?Number(s.cpuPercent).toFixed(1)+'%':'—'}</b></span><span>RAM <b>${s.memoryMB!=null?s.memoryMB+' MB':'—'}</b></span></div>
  ${s.lastError?`<div class="callout">${esc(s.lastError)}</div>`:''}
  <div class="actions">
    <button class="btn" ${up||busy?'disabled':''} onclick="action('${esc(d.id)}','start')">Start</button>
    <button class="btn danger" ${!up||busy?'disabled':''} onclick="action('${esc(d.id)}','stop')">Stop</button>
    <button class="btn" ${!up||busy?'disabled':''} onclick="action('${esc(d.id)}','restart')">Restart</button>
    <button class="btn" onclick="action('${esc(d.id)}','update')">Update</button>
    <button class="btn" onclick="action('${esc(d.id)}','backup')">Backup</button>
    <button class="btn" onclick="openConfig('${esc(d.id)}')">Config</button>
    <button class="btn" onclick="openBackups('${esc(d.id)}')">Backups</button>
  </div></div>`}).join('')+'</div>'
}
async function action(id,a){toast(`${id}: ${a}…`);try{const r=await api(`/api/servers/${encodeURIComponent(id)}/${a}`,{method:'POST'});toast(r.success?r.message:('Failed: '+r.message),r.success?'ok':'err');setTimeout(loadServers,800)}catch(e){toast(`${a} failed: ${e.message}`,'err')}}

function openCreate(){renderGamePicker('')}
function renderGamePicker(q=''){
 const list=GAMES.filter(g=>(g.label+' '+g.appId).toLowerCase().includes(q.toLowerCase()));
 openModal('Create server',`<div class="field"><input class="input" id="gameSearch" placeholder="Search game…" value="${esc(q)}" oninput="renderGamePicker(this.value)" autofocus></div><div class="games">${list.map(g=>`<button class="game" onclick="openCreateSettings('${g.key}')"><div class="gicon">${g.icon}</div><div class="gname">${esc(g.label)}</div><div class="gmeta">App ${g.appId} · ${esc(g.size)}</div></button>`).join('')}</div>`,'');
}
function openCreateSettings(key){
 const g=GAMES.find(x=>x.key===key);const path=`C:\\GameServers\\${g.dir}`;
 openModal('Install '+g.label,`<div class="formgrid">
  <div class="field"><label>Display name</label><input id="cName" value="${esc(g.label)}"></div>
  <div class="field"><label>Server ID</label><input id="cId" value="${esc(slugify(g.label))}"></div>
 </div>
 <div class="field"><label>Install location</label><input id="cPath" value="${esc(path)}"><div class="help">Files are installed on the Agent machine, not in the browser.</div></div>
 <div class="callout"><b>${g.icon} ${esc(g.label)}</b><br>Executable: <span id="cExe">${esc(joinPath(path,g.exe))}</span><br>Steam App ID: ${g.appId}${g.note?`<br><br>${esc(g.note)}`:''}</div>
 <div id="cErr" class="callout hidden"></div>`,
 `<button class="btn" onclick="renderGamePicker('')">Back</button><button class="btn primary" onclick="startInstall('${g.key}')">Start background install</button>`);
 $('#cPath').addEventListener('input',()=>$('#cExe').textContent=joinPath($('#cPath').value.trim(),g.exe));
}
async function startInstall(key){
 const g=GAMES.find(x=>x.key===key),name=$('#cName').value.trim(),id=$('#cId').value.trim(),path=$('#cPath').value.trim().replace(/[\\/]+$/,'');
 const err=$('#cErr');err.classList.add('hidden');if(!name||!path||!/^[a-z0-9][a-z0-9-]{0,63}$/.test(id)){err.textContent='Name/path are required and ID must contain only lowercase letters, digits and dashes.';err.classList.remove('hidden');return}
 const saveDirs=(g.saveRel||[]).map(x=>joinPath(path,x));
 const def={id,name,vmName:'',gameType:'SteamGeneric',guestExePath:joinPath(path,g.exe),guestWorkingDir:path,startArgs:g.args||[],saveDirs,steamAppId:g.appId,guestCredentialId:'default',logPathInGuest:g.logRel?joinPath(path,g.logRel):null,rconHost:'auto',rconPort:null,rconPassword:null,hostingMode:'BareMetal',scheduledTaskName:null,stopProcessNames:null,discordWebhookUrl:null};
 try{
  const ack=await api('/api/servers/install',{method:'POST',body:JSON.stringify({steamAppId:g.appId,installPath:path,serverDef:def})});
  rememberJob({jobId:ack.jobId,name,gameKey:g.key,gameLabel:g.label,icon:g.icon,path,createdAt:new Date().toISOString()});
  closeModal();showView('installs');toast(`${g.label} installation started in background.`,'ok');await refreshJobs();
 }catch(e){err.textContent=e.message;err.classList.remove('hidden')}
}

async function refreshJobs(render=true){
 const refs=loadJobRefs();let active=0;for(const r of refs){try{JOB_CACHE[r.jobId]=await api('/api/servers/install/'+encodeURIComponent(r.jobId));if(!JOB_CACHE[r.jobId].finished)active++}catch{JOB_CACHE[r.jobId]={jobId:r.jobId,phase:'expired',line:'Job is no longer available (the Agent may have restarted).',finished:true,success:false,logLines:[]}}}
 $('#installBadge').textContent=active;$('#installBadge').classList.toggle('hidden',active===0);if(render||CURRENT_VIEW==='installs')renderJobs();
}
function phaseText(p){return({queued:'Queued',steamcmd:'SteamCMD',download:'Downloading fallback',verify:'Verifying files',register:'Registering',done:'Completed',failed:'Failed',expired:'Expired'})[p]||p}
function renderJobs(){
 const refs=loadJobRefs(),root=$('#jobs');if(!refs.length){root.innerHTML='<div class="empty">No installation history in this browser.</div>';return}
 root.innerHTML=refs.map(r=>{const p=JOB_CACHE[r.jobId]||{};const pct=p.percentHint??0;const cls=p.finished?(p.success?'finished':'failed'):'';return `<div class="job ${cls}"><div class="jobtop"><div style="font-size:24px">${r.icon||'⬇'}</div><div class="grow"><div class="jobname">${esc(r.name||r.gameLabel||r.jobId)}</div><div class="jobphase">${esc(phaseText(p.phase||'loading'))} · ${esc(r.path||'')} · ${esc(r.jobId)}</div></div><div class="state ${p.success?'up':p.finished?'down':'warn'}">${p.finished?(p.success?'DONE':'FAILED'):'ACTIVE'}</div></div><div class="progress"><div class="bar" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div><div class="jobline">${esc(p.line||'Loading…')}</div><div class="jobbuttons"><button class="btn" onclick="openJob('${r.jobId}')">Details & log</button>${p.success?`<button class="btn" onclick="showView('servers');loadServers()">Open servers</button>`:''}</div></div>`}).join('')
}
function clearFinishedJobs(){const keep=loadJobRefs().filter(r=>!(JOB_CACHE[r.jobId]&&JOB_CACHE[r.jobId].finished));saveJobRefs(keep);renderJobs();refreshJobs(false)}
async function openJob(id){await refreshJobs(false);const r=loadJobRefs().find(x=>x.jobId===id)||{jobId:id};const p=JOB_CACHE[id]||{};const log=(p.logLines||[]).join('\n');openModal(`${r.icon||'⬇'} ${r.name||r.gameLabel||id}`,`<div class="jobphase">Job ${esc(id)} · ${esc(phaseText(p.phase||''))}</div><div class="progress"><div class="bar" style="width:${Math.max(0,Math.min(100,p.percentHint??0))}%"></div></div><div class="jobline" style="margin-bottom:10px">${esc(p.line||'')}</div><pre id="jobLog" class="log">${esc(log||'No log lines yet.')}</pre>`,`<button class="btn" onclick="refreshJobModal('${id}')">Refresh</button><button class="btn" onclick="closeModal()">Run in background</button>`,true);const el=$('#jobLog');el.scrollTop=el.scrollHeight}
async function refreshJobModal(id){await refreshJobs(false);openJob(id)}

async function openConfig(id){
 try{const d=SERVERS.find(x=>x.id===id),r=await api(`/api/servers/${encodeURIComponent(id)}/config`);if(!r.schema)return openModal('Config — '+(d?.name||id),'<div class="empty">No managed configuration schema is available for this server.</div>','<button class="btn" onclick="closeModal()">Close</button>');
 const vals=r.values||{};let html='';for(const sec of r.schema.sections||[]){html+=`<div class="section">${esc(sec.title)}</div><div class="formgrid">`;for(const f of sec.fields||[]){const v=vals[f.key]??f.default??'';html+=configField(f,v)}html+='</div>'}openModal('Config — '+(d?.name||id),`<form id="cfgForm">${html}</form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveConfig('${id}')">Save</button>`,true)
 }catch(e){toast('Config failed: '+e.message,'err')}
}
function configField(f,v){const key=esc(f.key),lab=esc(f.label),desc=f.description?`<div class="help">${esc(f.description)}</div>`:'';if(f.type==='Toggle')return `<div class="field"><label>${lab}</label><div class="checkrow"><input data-cfg="${key}" type="checkbox" ${String(v).toLowerCase()==='true'?'checked':''}><span>${String(v).toLowerCase()==='true'?'Enabled':'Toggle'}</span></div>${desc}</div>`;if(f.type==='Choice')return `<div class="field"><label>${lab}</label><select data-cfg="${key}">${(f.choices||[]).map(x=>`<option ${String(x)===String(v)?'selected':''}>${esc(x)}</option>`).join('')}</select>${desc}</div>`;if(f.type==='Multiline')return `<div class="field"><label>${lab}</label><textarea data-cfg="${key}">${esc(v)}</textarea>${desc}</div>`;const type=f.type==='Password'?'password':f.type==='Integer'||f.type==='Decimal'?'number':'text';return `<div class="field"><label>${lab}</label><input data-cfg="${key}" type="${type}" value="${esc(v)}" ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''}>${desc}</div>`}
async function saveConfig(id){const vals={};document.querySelectorAll('[data-cfg]').forEach(el=>{vals[el.dataset.cfg]=el.type==='checkbox'?String(el.checked):String(el.value)});try{await api(`/api/servers/${encodeURIComponent(id)}/config`,{method:'PUT',body:JSON.stringify(vals)});toast('Configuration saved.','ok');closeModal()}catch(e){toast('Save failed: '+e.message,'err')}}

async function openBackups(id){
 try{const d=SERVERS.find(x=>x.id===id),list=await api(`/api/servers/${encodeURIComponent(id)}/backups`);openModal('Backups — '+(d?.name||id),`<div>${(list||[]).length?(list||[]).map(b=>`<div class="job"><div class="jobtop"><div class="grow"><div class="jobname">${esc(b.checkpointName)}</div><div class="jobphase">${new Date(b.createdAt).toLocaleString()} · ${Math.round((b.sizeBytes||0)/1024/1024)} MB</div></div></div><div class="jobbuttons"><button class="btn" onclick="restoreBackup('${id}','${encodeURIComponent(b.checkpointName)}')">Restore</button><button class="btn danger" onclick="deleteBackup('${id}','${encodeURIComponent(b.checkpointName)}')">Delete</button></div></div>`).join(''):'<div class="empty">No backups yet.</div>'}</div>`,`<button class="btn" onclick="action('${id}','backup');closeModal()">Backup now</button><button class="btn" onclick="closeModal()">Close</button>`,true)}catch(e){toast('Backups failed: '+e.message,'err')}
}
async function restoreBackup(id,name){if(!confirm('Restore this backup? Stop the server first.'))return;try{const r=await api(`/api/servers/${encodeURIComponent(id)}/backups/${name}/restore`,{method:'POST'});toast(r.success?r.message:('Restore failed: '+r.message),r.success?'ok':'err');closeModal()}catch(e){toast('Restore failed: '+e.message,'err')}}
async function deleteBackup(id,name){if(!confirm('Delete this backup?'))return;try{await api(`/api/servers/${encodeURIComponent(id)}/backups/${name}`,{method:'DELETE'});toast('Backup deleted.','ok');openBackups(id)}catch(e){toast('Delete failed: '+e.message,'err')}}

(function init(){
 const p=new URLSearchParams(location.search);if(p.has('token')){CFG={url:(p.get('url')||location.origin).replace(/\/+$/,''),token:p.get('token')||''};localStorage.setItem(CFG_KEY,JSON.stringify(CFG));history.replaceState({},'',location.pathname)}else{try{CFG=JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}catch{CFG={}}}
 if(CFG.url&&CFG.token){boot().catch(e=>{toast(e.message,'err');logout()})}else{$('#login').classList.remove('hidden');$('#loginUrl').value=location.origin}
})();
</script>
</body>
</html>
